<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#efefef">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="付款">
    <title>付款</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon-180.png">
    <script src="js/lucide.min.js"></script>
    <style>
        :root { --page:#efefef; --sheet:#fff; --keypad:#f4f4f4; --key:#fff; --text:#171717; --green:#07c160; --green-soft:#a8e6c7; --topbar:calc(62px + env(safe-area-inset-top)); --keypad-height:calc(306px + env(safe-area-inset-bottom)); }
        * { box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; }
        body { margin:0; background:var(--page); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
        button,input { font:inherit; }
        button { border:0; cursor:pointer; }
        .transfer-app { width:100%; max-width:520px; height:100dvh; min-height:100dvh; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; background:var(--page); }
        .topbar { height:var(--topbar); padding:env(safe-area-inset-top) 14px 0; position:relative; display:flex; flex:0 0 var(--topbar); align-items:center; justify-content:center; background:var(--page); }
        .topbar h1 { margin:0; font-size:25px; font-weight:600; line-height:62px; }
        .back-button { width:46px; height:46px; position:absolute; bottom:6px; left:8px; display:grid; place-items:center; background:transparent; color:var(--text); border-radius:50%; }
        .back-button:active { background:#e2e2e2; }
        .back-button svg { width:32px; height:32px; stroke-width:1.8; }
        .payment-intro { height:200px; padding:34px 28px 0; position:relative; flex:0 0 200px; background:var(--page); }
        .payment-kind { margin:0; font-size:28px; font-weight:600; line-height:38px; }
        .recipient-name { max-width:calc(100% - 94px); margin:8px 0 0; overflow:hidden; color:#858585; font-size:25px; line-height:36px; white-space:nowrap; text-overflow:ellipsis; }
        .recipient-avatar { width:72px; height:72px; position:absolute; top:34px; right:28px; overflow:hidden; background:#f5f5f5; border-radius:2px; }
        .recipient-avatar img { width:100%; height:100%; display:block; object-fit:cover; }
        .amount-sheet { min-height:0; flex:1; padding:38px 28px 25px; position:relative; z-index:1; display:flex; flex-direction:column; background:var(--sheet); border-radius:28px 28px 0 0; }
        .amount-label { margin:0 0 22px; font-size:25px; line-height:34px; }
        .amount-editor { min-height:91px; display:flex; align-items:center; border-bottom:1px solid #e4e4e4; cursor:text; }
        .currency { flex:0 0 auto; margin-right:10px; font-size:60px; font-weight:700; line-height:1; }
        .amount-input { width:1ch; min-width:1ch; flex:0 0 auto; height:91px; padding:0; border:0; outline:0; color:var(--text); background:transparent; font-size:68px; font-weight:600; line-height:1; caret-color:transparent; }
        .amount-input::selection { background:rgba(7,193,96,.16); }
        .amount-input:focus { outline:0; }
        .amount-caret { width:3px; height:68px; flex:0 0 3px; display:block; background:#28b978; animation:amount-caret-blink 1s steps(1,end) infinite; }
        .amount-note { margin:12px 0 0; color:#607696; font-size:22px; line-height:30px; }
        .keypad { height:var(--keypad-height); padding:10px 10px calc(10px + env(safe-area-inset-bottom)); flex:0 0 var(--keypad-height); display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(0,1fr)); gap:10px; background:var(--keypad); border-top:1px solid #dedede; }
        .key { min-width:0; min-height:0; display:grid; place-items:center; color:#111; background:var(--key); border-radius:7px; font-size:39px; font-weight:500; line-height:1; box-shadow:0 1px 0 rgba(0,0,0,.02); -webkit-tap-highlight-color:transparent; }
        .key:active { background:#e8e8e8; }
        .key-delete { font-size:0; }
        .key-delete svg { width:32px; height:32px; stroke-width:2.1; }
        .key-zero { grid-column:1 / 3; grid-row:4; }
        .key-decimal { grid-column:3; grid-row:4; font-size:35px; }
        .key-one { grid-column:1; grid-row:1; }.key-two { grid-column:2; grid-row:1; }.key-three { grid-column:3; grid-row:1; }.key-delete { grid-column:4; grid-row:1; }
        .key-four { grid-column:1; grid-row:2; }.key-five { grid-column:2; grid-row:2; }.key-six { grid-column:3; grid-row:2; }
        .key-seven { grid-column:1; grid-row:3; }.key-eight { grid-column:2; grid-row:3; }.key-nine { grid-column:3; grid-row:3; }
        .pay-button { grid-column:4; grid-row:2 / 5; display:grid; place-items:center; padding:0 6px; color:rgba(255,255,255,.72); background:var(--green-soft); border-radius:8px; font-size:29px; font-weight:600; }
        .pay-button.enabled { color:#fff; background:var(--green); }
        .pay-button:active { background:#06ad56; }
        .pay-button:disabled { cursor:default; }
        @keyframes amount-caret-blink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
        @media (max-width:380px) { :root { --keypad-height:calc(294px + env(safe-area-inset-bottom)); }.payment-intro { height:188px; flex-basis:188px; padding-top:27px; }.payment-kind { font-size:25px; }.recipient-name { font-size:22px; }.recipient-avatar { top:27px; right:22px; width:64px; height:64px; }.amount-sheet { padding:28px 22px 20px; }.amount-label { margin-bottom:15px; font-size:23px; }.currency { font-size:54px; margin-right:8px; }.amount-input { height:80px; font-size:60px; }.amount-caret { height:58px; }.amount-editor { min-height:80px; }.amount-note { margin-top:10px; font-size:19px; }.key { font-size:35px; } }
        @media (min-width:521px) { body { padding:20px 0; }.transfer-app { height:calc(100dvh - 40px); min-height:calc(100dvh - 40px); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.16); } }
    </style>
</head>
<body>
<div class="transfer-app">
    <header class="topbar">
        <button class="back-button" id="backButton" type="button" aria-label="返回"><i data-lucide="arrow-left"></i></button>
        <h1>付款</h1>
    </header>
    <section class="payment-intro" aria-label="收款人信息">
        <p class="payment-kind">付款给个人</p>
        <p class="recipient-name" id="recipientName">XXX</p>
        <div class="recipient-avatar"><img id="recipientAvatarImage" src="img/default-transfer-avatar.png" alt="收款人头像"></div>
    </section>
    <section class="amount-sheet">
        <p class="amount-label">金额</p>
        <label class="amount-editor" id="amountEditor" for="amountInput">
            <span class="currency">¥</span>
            <input class="amount-input" id="amountInput" type="text" readonly inputmode="none" autocomplete="off" aria-label="付款金额">
            <span class="amount-caret" aria-hidden="true"></span>
        </label>
        <p class="amount-note">添加备注</p>
    </section>
    <section class="keypad" aria-label="数字键盘">
        <button class="key key-one" type="button" data-key="1">1</button>
        <button class="key key-two" type="button" data-key="2">2</button>
        <button class="key key-three" type="button" data-key="3">3</button>
        <button class="key key-delete" type="button" data-action="delete" aria-label="删除"><i data-lucide="delete"></i></button>
        <button class="key key-four" type="button" data-key="4">4</button>
        <button class="key key-five" type="button" data-key="5">5</button>
        <button class="key key-six" type="button" data-key="6">6</button>
        <button class="key key-seven" type="button" data-key="7">7</button>
        <button class="key key-eight" type="button" data-key="8">8</button>
        <button class="key key-nine" type="button" data-key="9">9</button>
        <button class="key key-zero" type="button" data-key="0">0</button>
        <button class="key key-decimal" type="button" data-key=".">.</button>
        <button class="pay-button" id="confirmButton" type="button" disabled>付款</button>
    </section>
</div>
<script>
    (function () {
        lucide.createIcons();
        var amountInput = document.getElementById('amountInput');
        var amountEditor = document.getElementById('amountEditor');
        var confirmButton = document.getElementById('confirmButton');
        var params = new URLSearchParams(window.location.search);
        var recipient = (params.get('name') || 'XXX').slice(0, 20);
        var defaultAvatar = localStorage.getItem('scan_default_avatar') || 'img/default-transfer-avatar.png';
        var amount = '';

        document.title = '付款';
        document.getElementById('recipientName').textContent = recipient;
        document.getElementById('recipientAvatarImage').src = defaultAvatar;
        document.getElementById('recipientAvatarImage').addEventListener('error', function () {
            this.src = 'img/default-transfer-avatar.png';
        });

        function updateAmount() {
            amountInput.value = amount;
            amountInput.style.width = Math.max(1, amount.length + 0.25) + 'ch';
            var isValid = Number(amount) > 0;
            confirmButton.disabled = !isValid;
            confirmButton.classList.toggle('enabled', isValid);
        }

        function appendAmount(value) {
            if (value === '.') {
                if (amount.indexOf('.') !== -1) return;
                amount = amount || '0';
                amount += '.';
            } else if (amount === '0') {
                amount = value;
            } else if (amount.indexOf('.') === -1 || amount.split('.')[1].length < 2) {
                var integerPart = amount.split('.')[0];
                if (integerPart.length >= 8 && amount.indexOf('.') === -1) return;
                amount += value;
            }
            updateAmount();
            amountInput.focus({ preventScroll:true });
        }

        function deleteAmount() {
            amount = amount.slice(0, -1);
            updateAmount();
            amountInput.focus({ preventScroll:true });
        }

        document.querySelectorAll('[data-key]').forEach(function (button) {
            button.addEventListener('click', function () { appendAmount(button.getAttribute('data-key')); });
        });
        document.querySelector('[data-action="delete"]').addEventListener('click', deleteAmount);
        amountEditor.addEventListener('click', function () { amountInput.focus({ preventScroll:true }); });
        document.addEventListener('keydown', function (event) {
            if (/^\d$/.test(event.key) || event.key === '.') {
                event.preventDefault();
                appendAmount(event.key);
            } else if (event.key === 'Backspace') {
                event.preventDefault();
                deleteAmount();
            }
        });
        document.getElementById('backButton').addEventListener('click', function () {
            if (history.length > 1) history.back();
            else window.location.href = 'index.html';
        });
        confirmButton.addEventListener('click', function () {
            if (confirmButton.disabled) return;
            window.location.href = 'success.html?name=' + encodeURIComponent(recipient) + '&amount=' + encodeURIComponent(amount);
        });
        updateAmount();
    }());
</script>
</body>
</html>
