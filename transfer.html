<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#efefef">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="付款">
    <title>付款</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon-180.png">
    <script src="js/lucide.min.js"></script>
    <style>
        :root { --page:#efefef; --sheet:#fff; --keypad:#f4f4f4; --key:#fff; --text:#171717; --green:#07c160; --green-soft:#a8e6c7; --topbar:calc(62px + env(safe-area-inset-top)); --keypad-height:calc(306px + env(safe-area-inset-bottom)); }
        * { box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; }
        body { margin:0; background:var(--page); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
        button,input { font:inherit; }
        button { border:0; cursor:pointer; }
        .transfer-app { width:100%; max-width:520px; height:100dvh; min-height:100dvh; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; background:var(--page); }
        .topbar { height:var(--topbar); padding:env(safe-area-inset-top) 14px 0; position:relative; display:flex; flex:0 0 var(--topbar); align-items:center; justify-content:center; background:var(--page); }
        .topbar h1 { margin:0; font-size:25px; font-weight:600; line-height:62px; }
        .back-button { width:46px; height:46px; position:absolute; bottom:6px; left:8px; display:grid; place-items:center; background:transparent; color:var(--text); border-radius:50%; }
        .back-button:active { background:#e2e2e2; }
        .back-button svg { width:32px; height:32px; stroke-width:1.8; }
        .payment-intro { height:160px; padding:34px 28px 0; position:relative; flex:0 0 160px; background:var(--page); }
        .payment-kind { margin:0; font-size:28px; font-weight:600; line-height:38px; }
        .recipient-name { max-width:calc(100% - 94px); margin:8px 0 0; overflow:hidden; color:#858585; font-size:25px; line-height:36px; white-space:nowrap; text-overflow:ellipsis; }
        .recipient-avatar { width:72px; height:72px; position:absolute; top:34px; right:28px; overflow:hidden; background:#f5f5f5; border-radius:2px; }
        .recipient-avatar img { width:100%; height:100%; display:block; object-fit:cover; }
        .amount-sheet { min-height:0; flex:1; padding:38px 28px 25px; position:relative; z-index:1; display:flex; flex-direction:column; background:var(--sheet); border-radius:28px 28px 0 0; }
        .amount-label { margin:0 0 22px; font-size:25px; line-height:34px; }
        .amount-editor { min-height:91px; display:flex; align-items:center; border-bottom:1px solid #e4e4e4; cursor:text; }
        .currency { flex:0 0 auto; margin-right:10px; font-size:60px; font-weight:700; line-height:1; }
        .amount-input { width:1ch; min-width:1ch; flex:0 0 auto; height:91px; padding:0; border:0; outline:0; color:var(--text); background:transparent; font-size:68px; font-weight:600; line-height:1; caret-color:transparent; }
        .amount-input::selection { background:rgba(7,193,96,.16); }
        .amount-input:focus { outline:0; }
        .amount-caret { width:3px; height:68px; flex:0 0 3px; display:block; background:#28b978; animation:amount-caret-blink 1s steps(1,end) infinite; }
        .amount-note { margin:12px 0 0; color:#607696; font-size:22px; line-height:30px; }
        .keypad { height:var(--keypad-height); padding:10px 10px calc(10px + env(safe-area-inset-bottom)); flex:0 0 var(--keypad-height); display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(0,1fr)); gap:10px; background:var(--keypad); border-top:1px solid #dedede; }
        .key { min-width:0; min-height:0; display:grid; place-items:center; color:#111; background:var(--key); border-radius:7px; font-size:39px; font-weight:500; line-height:1; box-shadow:0 1px 0 rgba(0,0,0,.02); -webkit-tap-highlight-color:transparent; }
        .key:active { background:#e8e8e8; }
        .key-delete { font-size:0; }
        .key-delete svg { width:32px; height:32px; stroke-width:2.1; }
        .key-zero { grid-column:1 / 3; grid-row:4; }
        .key-decimal { grid-column:3; grid-row:4; font-size:35px; }
        .key-one { grid-column:1; grid-row:1; }.key-two { grid-column:2; grid-row:1; }.key-three { grid-column:3; grid-row:1; }.key-delete { grid-column:4; grid-row:1; }
        .key-four { grid-column:1; grid-row:2; }.key-five { grid-column:2; grid-row:2; }.key-six { grid-column:3; grid-row:2; }
        .key-seven { grid-column:1; grid-row:3; }.key-eight { grid-column:2; grid-row:3; }.key-nine { grid-column:3; grid-row:3; }
        .pay-button { grid-column:4; grid-row:2 / 5; display:grid; place-items:center; padding:0 6px; color:rgba(255,255,255,.72); background:var(--green-soft); border-radius:8px; font-size:29px; font-weight:600; }
        .pay-button.enabled { color:#fff; background:var(--green); }
        .pay-button:active { background:#06ad56; }
        .pay-button:disabled { cursor:default; }
        .payment-processing { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
        .payment-processing.is-visible { display:flex; }
        .processing-card { width:202px; min-height:224px; padding:30px 18px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#f5f5f7; background:#252525; border:1px solid rgba(255,255,255,.08); border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,.3); }
        .processing-logo { width:76px; height:64px; position:relative; display:block; background:#f1f1f4; border-radius:50%; }
        .processing-logo::before { content:""; width:25px; height:16px; position:absolute; bottom:-7px; left:11px; background:#f1f1f4; clip-path:polygon(0 0,100% 0,0 100%); }
        .processing-logo::after { content:""; width:40px; height:21px; position:absolute; top:19px; left:19px; border-bottom:8px solid #252525; border-left:8px solid #252525; transform:rotate(-45deg); border-radius:3px; }
        .processing-title { margin:28px 0 13px; font-size:25px; font-weight:600; line-height:1.2; }
        .processing-dots { height:18px; display:flex; align-items:center; gap:14px; }
        .processing-dots i { width:10px; height:10px; display:block; background:#f1f1f4; border-radius:50%; animation:processing-dot 1.05s ease-in-out infinite; }
        .processing-dots i:nth-child(2) { animation-delay:.16s; }
        .processing-dots i:nth-child(3) { animation-delay:.32s; }
        @keyframes processing-dot { 0%,100% { opacity:.35; transform:scale(.72); } 45% { opacity:1; transform:scale(1); } }
        .password-overlay { position:fixed; inset:0; z-index:30; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.5); }
        .password-overlay.is-visible { display:flex; }
        .password-sheet { width:min(520px,100%); height:min(91dvh,620px); min-height:0; padding:8px 16px calc(8px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; overflow:hidden; color:#202027; background:#f8f8fa; border-radius:20px 20px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.14); }
        .password-header { height:36px; min-height:36px; display:flex; align-items:center; justify-content:space-between; }
        .password-close { width:38px; height:38px; display:grid; place-items:center; color:#1e1e22; background:transparent; border-radius:50%; }
        .password-close:active { background:#e8e8ed; }
        .password-close svg { width:26px; height:26px; stroke-width:1.8; }
        .fingerprint-button { padding:8px 0; color:#3c75c5; background:transparent; font-size:15px; }
        .password-summary { padding:0 4px 9px; border-bottom:1px solid #dedee3; }
        .password-title { margin:2px 0 0; text-align:center; color:#3d3d45; font-size:16px; font-weight:500; line-height:22px; }
        .password-amount { margin:0; text-align:center; font-size:29px; font-weight:600; line-height:36px; }
        .password-method-heading { height:36px; min-height:36px; padding:0 4px; display:flex; align-items:center; justify-content:space-between; color:#45454d; font-size:15px; }
        .password-change { display:flex; align-items:center; gap:2px; color:#666670; }
        .password-change svg { width:16px; height:16px; stroke-width:1.7; }
        .password-method { height:56px; min-height:56px; padding:0 13px; display:flex; align-items:center; justify-content:space-between; color:#2d2d33; background:#fff8df; border-radius:8px; box-shadow:0 5px 12px rgba(76,70,42,.08); font-size:16px; }
        .password-method-info { min-width:0; display:flex; align-items:center; gap:11px; }
        .wallet-balance-icon { width:30px; height:30px; flex:0 0 30px; overflow:hidden; background:#ffd746; border-radius:50%; }
        .wallet-balance-icon img { width:100%; height:100%; display:block; object-fit:cover; object-position:center; transform:scale(1.08); }
        .password-method-check { color:#08a95a; font-size:27px; font-weight:600; line-height:1; }
        .password-digits { height:44px; margin:13px 0 8px; display:flex; align-items:stretch; justify-content:center; gap:8px; }
        .password-digit { width:48px; min-width:0; max-width:40px; height:36px; flex:1 1 48px; display:grid; place-items:center; color:#222229; background:#e5e6eb; border-radius:5px; font-size:19px; font-style:normal; line-height:1; }
        .password-digit.is-filled { background:#dddfe5; }
        .password-hint { width:1px; height:1px; margin:-1px; padding:0; position:absolute; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
        .password-keypad { min-height:0; flex:1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(4,minmax(0,1fr)); gap:1px; background:#d7d7df; border-top:1px solid #d0d0d8; }
        .password-key { min-width:0; min-height:0; display:grid; place-items:center; color:#202027; background:#fff; font-size:28px; font-weight:400; -webkit-tap-highlight-color:transparent; }
        .password-key:active { background:#e5e5eb; }
        .password-key-delete { font-size:0; }
        .password-key-empty,.password-key-delete { background:#e1e2e7; }
        .password-key-empty { cursor:default; }
        .password-delete-icon { width:42px; height:27px; position:relative; display:block; background:#3b3b3d; border-radius:2px; clip-path:polygon(0 50%,22% 0,100% 0,100% 100%,22% 100%); }
        .password-delete-icon::before,.password-delete-icon::after { content:""; width:17px; height:2px; position:absolute; top:50%; left:61%; display:block; background:#fff; border-radius:2px; }
        .password-delete-icon::before { transform:translate(-50%,-50%) rotate(45deg); }
        .password-delete-icon::after { transform:translate(-50%,-50%) rotate(-45deg); }
        @media (max-width:380px) { .processing-card { width:186px; min-height:210px; }.processing-logo { width:68px; height:58px; }.processing-logo::after { transform:scale(.88) rotate(-45deg); transform-origin:center; }.processing-title { margin-top:24px; font-size:23px; }.password-sheet { height:60dvh; padding-left:10px; padding-right:10px; }.password-title { font-size:15px; }.password-amount { font-size:27px; }.password-digits { gap:6px; }.password-key { font-size:25px; } }
        @keyframes amount-caret-blink { 0%,45% { opacity:1; } 46%,100% { opacity:0; } }
        @media (max-width:380px) { :root { --keypad-height:calc(294px + env(safe-area-inset-bottom)); }.payment-intro { height:150px; flex-basis:150px; padding-top:27px; }.payment-kind { font-size:25px; }.recipient-name { font-size:22px; }.recipient-avatar { top:27px; right:22px; width:64px; height:64px; }.amount-sheet { padding:28px 22px 20px; }.amount-label { margin-bottom:15px; font-size:23px; }.currency { font-size:54px; margin-right:8px; }.amount-input { height:80px; font-size:60px; }.amount-caret { height:58px; }.amount-editor { min-height:80px; }.amount-note { margin-top:10px; font-size:19px; }.key { font-size:35px; } }
        @media (min-width:521px) { body { padding:20px 0; }.transfer-app { height:calc(100dvh - 40px); min-height:calc(100dvh - 40px); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.16); } }
    </style>
</head>
<body>
<div class="transfer-app">
    <header class="topbar">
        <button class="back-button" id="backButton" type="button" aria-label="返回"><i data-lucide="arrow-left"></i></button>
        <h1>付款</h1>
    </header>
    <section class="payment-intro" aria-label="收款人信息">
        <p class="payment-kind">付款给个人</p>
        <p class="recipient-name" id="recipientName">XXX</p>
        <div class="recipient-avatar"><img id="recipientAvatarImage" src="img/default-transfer-avatar.png" alt="收款人头像"></div>
    </section>
    <section class="amount-sheet">
        <p class="amount-label">金额</p>
        <label class="amount-editor" id="amountEditor" for="amountInput">
            <span class="currency">¥</span>
            <input class="amount-input" id="amountInput" type="text" readonly inputmode="none" autocomplete="off" aria-label="付款金额">
            <span class="amount-caret" aria-hidden="true"></span>
        </label>
        <p class="amount-note">添加备注</p>
    </section>
    <section class="keypad" aria-label="数字键盘">
        <button class="key key-one" type="button" data-key="1">1</button>
        <button class="key key-two" type="button" data-key="2">2</button>
        <button class="key key-three" type="button" data-key="3">3</button>
        <button class="key key-delete" type="button" data-action="delete" aria-label="删除"><i data-lucide="delete"></i></button>
        <button class="key key-four" type="button" data-key="4">4</button>
        <button class="key key-five" type="button" data-key="5">5</button>
        <button class="key key-six" type="button" data-key="6">6</button>
        <button class="key key-seven" type="button" data-key="7">7</button>
        <button class="key key-eight" type="button" data-key="8">8</button>
        <button class="key key-nine" type="button" data-key="9">9</button>
        <button class="key key-zero" type="button" data-key="0">0</button>
        <button class="key key-decimal" type="button" data-key=".">.</button>
        <button class="pay-button" id="confirmButton" type="button" disabled>付款</button>
    </section>
    <div class="payment-processing" id="processingOverlay" aria-hidden="true">
        <div class="processing-card" role="status" aria-live="polite">
            <span class="processing-logo" aria-hidden="true"></span>
            <p class="processing-title">微信支付</p>
            <div class="processing-dots" aria-label="处理中"><i></i><i></i><i></i></div>
        </div>
    </div>
    <div class="password-overlay" id="passwordOverlay" aria-hidden="true">
        <section class="password-sheet" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
            <header class="password-header">
                <button class="password-close" id="passwordClose" type="button" aria-label="关闭"><i data-lucide="x"></i></button>
                <button class="fingerprint-button" id="fingerprintButton" type="button">使用指纹</button>
            </header>
            <div class="password-summary">
                <p class="password-title" id="passwordTitle">付款给<span id="passwordRecipient">XXX</span></p>
                <p class="password-amount" id="passwordAmount">¥ 0.00</p>
            </div>
            <div class="password-method-heading"><span>付款方式</span><span class="password-change">更改<i data-lucide="chevron-down"></i></span></div>
            <div class="password-method">
                <span class="password-method-info"><span class="wallet-balance-icon"><img src="img/wallet-balance-icon.png" alt="零钱"></span><span>零钱</span></span>
                <span class="password-method-check" aria-label="已选零钱">✓</span>
            </div>
            <div class="password-digits" id="passwordDigits" aria-label="支付密码，六位数字"><i class="password-digit"></i><i class="password-digit"></i><i class="password-digit"></i><i class="password-digit"></i><i class="password-digit"></i><i class="password-digit"></i></div>
            <p class="password-hint" id="passwordHint">请输入6位支付密码</p>
            <div class="password-keypad" aria-label="支付密码键盘">
                <button class="password-key" type="button" data-password-key="1">1</button>
                <button class="password-key" type="button" data-password-key="2">2</button>
                <button class="password-key" type="button" data-password-key="3">3</button>
                <button class="password-key" type="button" data-password-key="4">4</button>
                <button class="password-key" type="button" data-password-key="5">5</button>
                <button class="password-key" type="button" data-password-key="6">6</button>
                <button class="password-key" type="button" data-password-key="7">7</button>
                <button class="password-key" type="button" data-password-key="8">8</button>
                <button class="password-key" type="button" data-password-key="9">9</button>
                <button class="password-key password-key-empty" type="button" tabindex="-1" aria-hidden="true"></button>
                <button class="password-key" type="button" data-password-key="0">0</button>
                <button class="password-key password-key-delete" type="button" data-password-action="delete" aria-label="删除"><span class="password-delete-icon" aria-hidden="true"></span></button>
            </div>
        </section>
    </div>
</div>
<script>
    (function () {
        lucide.createIcons();
        var amountInput = document.getElementById('amountInput');
        var amountEditor = document.getElementById('amountEditor');
        var confirmButton = document.getElementById('confirmButton');
        var processingOverlay = document.getElementById('processingOverlay');
        var passwordOverlay = document.getElementById('passwordOverlay');
        var passwordRecipient = document.getElementById('passwordRecipient');
        var passwordAmount = document.getElementById('passwordAmount');
        var passwordHint = document.getElementById('passwordHint');
        var passwordDigits = document.querySelectorAll('.password-digit');
        var params = new URLSearchParams(window.location.search);
        var recipient = (params.get('name') || 'XXX').slice(0, 20);
        var defaultAvatar = localStorage.getItem('scan_default_avatar') || 'img/default-transfer-avatar.png';
        var amount = '';
        var password = '';
        var isSubmitting = false;
        var passwordValidationTimer = null;

        document.title = '付款';
        document.getElementById('recipientName').textContent = recipient;
        document.getElementById('recipientAvatarImage').src = defaultAvatar;
        document.getElementById('recipientAvatarImage').addEventListener('error', function () {
            this.src = 'img/default-transfer-avatar.png';
        });

        function updateAmount() {
            amountInput.value = amount;
            amountInput.style.width = Math.max(1, amount.length + 0.25) + 'ch';
            var isValid = Number(amount) > 0;
            confirmButton.disabled = !isValid;
            confirmButton.classList.toggle('enabled', isValid);
        }

        function appendAmount(value) {
            if (value === '.') {
                if (amount.indexOf('.') !== -1) return;
                amount = amount || '0';
                amount += '.';
            } else if (amount === '0') {
                amount = value;
            } else if (amount.indexOf('.') === -1 || amount.split('.')[1].length < 2) {
                var integerPart = amount.split('.')[0];
                if (integerPart.length >= 8 && amount.indexOf('.') === -1) return;
                amount += value;
            }
            updateAmount();
            amountInput.focus({ preventScroll:true });
        }

        function deleteAmount() {
            amount = amount.slice(0, -1);
            updateAmount();
            amountInput.focus({ preventScroll:true });
        }

        document.querySelectorAll('[data-key]').forEach(function (button) {
            button.addEventListener('click', function () { appendAmount(button.getAttribute('data-key')); });
        });
        document.querySelector('[data-action="delete"]').addEventListener('click', deleteAmount);
        amountEditor.addEventListener('click', function () { amountInput.focus({ preventScroll:true }); });
        document.addEventListener('keydown', function (event) {
            if (passwordOverlay.classList.contains('is-visible')) {
                if (/^\d$/.test(event.key)) {
                    event.preventDefault();
                    appendPassword(event.key);
                } else if (event.key === 'Backspace') {
                    event.preventDefault();
                    deletePassword();
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    document.getElementById('passwordClose').click();
                }
                return;
            }
            if (/^\d$/.test(event.key) || event.key === '.') {
                event.preventDefault();
                appendAmount(event.key);
            } else if (event.key === 'Backspace') {
                event.preventDefault();
                deleteAmount();
            }
        });
        document.getElementById('backButton').addEventListener('click', function () {
            if (isSubmitting) return;
            if (history.length > 1) history.back();
            else window.location.href = 'index.html';
        });

        function setOverlayVisible(element, visible) {
            element.classList.toggle('is-visible', visible);
            element.setAttribute('aria-hidden', visible ? 'false' : 'true');
        }

        function updatePassword() {
            passwordDigits.forEach(function (digit, index) {
                digit.classList.toggle('is-filled', index < password.length);
                digit.textContent = index < password.length ? '•' : '';
            });
        }

        function showPasswordSheet() {
            window.clearTimeout(passwordValidationTimer);
            password = '';
            passwordRecipient.textContent = recipient;
            passwordAmount.textContent = '¥ ' + Number(amount).toFixed(2);
            passwordHint.textContent = '请输入6位支付密码';
            updatePassword();
            setOverlayVisible(passwordOverlay, true);
        }

        function finishPayment() {
            if (password.length !== 6 || !passwordOverlay.classList.contains('is-visible')) return;
            passwordHint.textContent = '密码验证成功';
            window.setTimeout(function () {
                window.location.href = 'success.html?name=' + encodeURIComponent(recipient) + '&amount=' + encodeURIComponent(amount);
            }, 360);
        }

        function appendPassword(value) {
            if (!passwordOverlay.classList.contains('is-visible') || password.length >= 6) return;
            password += value;
            updatePassword();
            if (password.length === 6) {
                passwordHint.textContent = '正在验证支付密码';
                passwordValidationTimer = window.setTimeout(finishPayment, 480);
            }
        }

        function deletePassword() {
            window.clearTimeout(passwordValidationTimer);
            if (password.length === 6) passwordHint.textContent = '请输入6位支付密码';
            password = password.slice(0, -1);
            updatePassword();
        }

        document.querySelectorAll('[data-password-key]').forEach(function (button) {
            button.addEventListener('click', function () { appendPassword(button.getAttribute('data-password-key')); });
        });
        document.querySelector('[data-password-action="delete"]').addEventListener('click', deletePassword);
        document.getElementById('passwordClose').addEventListener('click', function () {
            window.clearTimeout(passwordValidationTimer);
            setOverlayVisible(passwordOverlay, false);
            isSubmitting = false;
            confirmButton.disabled = false;
        });
        document.getElementById('fingerprintButton').addEventListener('click', function () {
            passwordHint.textContent = '请使用数字键盘输入支付密码';
        });
        confirmButton.addEventListener('click', function () {
            if (confirmButton.disabled || isSubmitting) return;
            isSubmitting = true;
            confirmButton.disabled = true;
            setOverlayVisible(processingOverlay, true);
            window.setTimeout(function () {
                setOverlayVisible(processingOverlay, false);
                showPasswordSheet();
            }, 1400);
        });
        updateAmount();
    }());
</script>
</body>
</html>
