<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="扫一扫">
    <title>扫一扫</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon-180.png">
    <script src="js/lucide.min.js"></script>
    <script src="js/ocr/tesseract.min.js"></script>
    <style>
        :root { --green:#07c160; --white:#fff; --mode-height:calc(96px + env(safe-area-inset-bottom)); }
        * { box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; }
        body { margin:0; min-height:100dvh; background:#000; color:var(--white); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
        button,input { font:inherit; }
        button { border:0; cursor:pointer; }
        .scan-app { width:100%; max-width:520px; min-height:100dvh; margin:0 auto; position:relative; overflow:hidden; background:#77736f; isolation:isolate; }
        .viewfinder { position:absolute; inset:0; z-index:0; overflow:hidden; background:#77736f; cursor:pointer; }
        .viewfinder:focus-visible { outline:2px solid var(--green); outline-offset:-2px; }
        .camera-video { width:100%; height:100%; display:block; opacity:0; object-fit:cover; transition:opacity .2s; }
        .camera-on .camera-video { opacity:1; }
        .camera-shade { position:absolute; inset:0; background:rgba(0,0,0,.24); pointer-events:none; }
        .scan-beam { width:calc(100% - 44px); max-width:460px; height:2px; position:absolute; top:43%; left:50%; background:#18e67a; box-shadow:0 0 7px 2px rgba(24,230,122,.72),0 0 24px 8px rgba(24,230,122,.22); transform:translateX(-50%); animation:scan-line 2.8s ease-in-out infinite; pointer-events:none; }
        .top-controls { height:calc(86px + env(safe-area-inset-top)); padding:calc(18px + env(safe-area-inset-top)) 22px 0; position:absolute; top:0; right:0; left:0; z-index:4; display:flex; align-items:flex-start; justify-content:space-between; pointer-events:none; }
        .top-button { width:44px; height:44px; display:grid; place-items:center; pointer-events:auto; color:#76716e; background:rgba(255,255,255,.95); border-radius:50%; }
        .top-button:active { opacity:.72; }
        .top-button svg { width:26px; height:26px; stroke-width:2.3; }
        .settings-button { background:rgba(30,30,30,.48); color:#fff; }
        .settings-button svg { width:25px; height:25px; stroke-width:2.1; }
        .privacy-dot { width:8px; height:8px; position:absolute; top:calc(10px + env(safe-area-inset-top)); right:26px; border-radius:50%; background:#1fdf73; box-shadow:0 0 4px rgba(31,223,115,.7); }
        .scan-main { position:absolute; inset:0 0 var(--mode-height); z-index:3; pointer-events:none; }
        .hint { width:100%; margin:0; padding:0 22px; position:absolute; bottom:196px; display:none; color:rgba(255,255,255,.88); font-size:17px; font-weight:400; line-height:24px; text-align:center; letter-spacing:0; text-shadow:0 1px 3px rgba(0,0,0,.4); }
        .hint.visible { display:block; }
        .hint.recognizing { color:#bfffd8; }
        .bottom-actions { position:absolute; right:22px; bottom:28px; left:22px; display:flex; align-items:center; justify-content:space-between; }
        .action-button { pointer-events:auto; color:#fff; background:rgba(45,43,41,.62); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
        .action-button:active { background:rgba(45,43,41,.78); }
        .qr-button { min-width:250px; height:76px; padding:0 21px; display:flex; align-items:center; gap:14px; border-radius:38px; text-align:left; }
        .qr-button svg { width:30px; height:30px; flex:0 0 30px; stroke-width:2.2; }
        .qr-copy { min-width:0; display:flex; flex-direction:column; gap:3px; }
        .qr-title { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:600; line-height:24px; white-space:nowrap; }
        .new-badge { padding:1px 8px 2px; border-radius:13px; background:#fa5151; font-size:12px; font-weight:500; line-height:21px; }
        .qr-subtitle { color:rgba(255,255,255,.62); font-size:13px; line-height:18px; white-space:nowrap; }
        .album-button { width:62px; height:62px; display:grid; place-items:center; border-radius:50%; }
        .album-button svg { width:27px; height:27px; stroke-width:1.9; }
        .mode-bar { height:var(--mode-height); padding-bottom:env(safe-area-inset-bottom); position:absolute; right:0; bottom:0; left:0; z-index:5; display:flex; align-items:center; justify-content:center; gap:48px; background:#050505; }
        .mode-button { width:104px; height:76px; position:relative; background:transparent; color:#747474; font-size:22px; line-height:28px; }
        .mode-button.active { color:#fff; }
        .mode-button.active::after { content:""; width:7px; height:7px; position:absolute; left:50%; bottom:5px; border-radius:50%; background:#fff; transform:translateX(-50%); }
        .toast { max-width:calc(100% - 40px); position:fixed; left:50%; bottom:calc(var(--mode-height) + 112px); z-index:8; transform:translate(-50%,12px); padding:10px 15px; opacity:0; pointer-events:none; background:rgba(0,0,0,.72); color:#fff; border-radius:4px; font-size:13px; text-align:center; transition:opacity .2s,transform .2s; }
        .toast.show { opacity:1; transform:translate(-50%,0); }
        @keyframes scan-line { 0%,100% { top:39%; opacity:.55; } 50% { top:57%; opacity:1; } }
        @media (max-width:380px) { .bottom-actions { right:16px; left:16px; }.qr-button { min-width:226px; padding:0 17px; gap:11px; }.qr-title { font-size:17px; }.qr-subtitle { font-size:12px; }.album-button { width:58px; height:58px; } }
        @media (min-width:521px) { body { padding:20px 0; }.scan-app { min-height:calc(100dvh - 40px); height:calc(100dvh - 40px); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.24); } }
    </style>
</head>
<body>
<div class="scan-app">
    <div class="viewfinder" id="viewfinder" role="button" tabindex="0" aria-label="轻触开启摄像头"><video class="camera-video" id="cameraVideo" autoplay playsinline muted></video><div class="camera-shade"></div><span class="scan-beam" aria-hidden="true"></span></div>
    <header class="top-controls"><button class="top-button" id="backButton" aria-label="关闭扫一扫"><i data-lucide="x"></i></button><button class="top-button settings-button" id="settingsButton" aria-label="转账人名称设置"><i data-lucide="settings"></i></button><span class="privacy-dot" aria-hidden="true"></span></header>
    <main class="scan-main">
        <p class="hint" id="hint" aria-live="polite"></p>
        <div class="bottom-actions"><button class="action-button qr-button" id="myQrButton"><i data-lucide="qr-code"></i><span class="qr-copy"><span class="qr-title">我的二维码 <span class="new-badge">NEW</span></span><span class="qr-subtitle">添加朋友、收照片、收红包</span></span></button><button class="action-button album-button" id="albumButton" aria-label="相册"><i data-lucide="image"></i></button></div>
    </main>
    <nav class="mode-bar" aria-label="扫一扫模式"><button class="mode-button active" type="button">扫一扫</button><button class="mode-button" id="translateButton" type="button">翻译</button></nav>
    <canvas id="scanCanvas" hidden></canvas>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
    (function () {
        lucide.createIcons();
        var params = new URLSearchParams(window.location.search);
        var viewfinder = document.getElementById('viewfinder');
        var video = document.getElementById('cameraVideo');
        var canvas = document.getElementById('scanCanvas');
        var hint = document.getElementById('hint');
        var toast = document.getElementById('toast');
        var stream;
        var scanning = false;
        var timer;
        var ocrWorker;
        var ocrLoading = false;
        var ocrRunning = false;
        var ocrTimer;
        var ocrCandidate = '';
        var ocrCandidateCount = 0;
        var ocrFailureCount = 0;
        var scanSettings = null;
        var customTransferTimer;
        var OCR_SPEEDS = {
            fast: { interval: 800, confirmations: 1 },
            balanced: { interval: 1600, confirmations: 2 },
            accurate: { interval: 3000, confirmations: 3 }
        };

        function readScanSettings() {
            var speed = localStorage.getItem('scan_ocr_speed') || 'balanced';
            return {
                customName: cleanOcrName(localStorage.getItem('scan_custom_name') || ''),
                useCustom: localStorage.getItem('scan_use_custom') === 'true',
                speed: OCR_SPEEDS[speed] ? speed : 'balanced',
                showOcrText: localStorage.getItem('scan_show_ocr_text') !== 'false'
            };
        }

        function setHint(message, isRecognizing) {
            var shouldShow = Boolean(scanSettings && scanSettings.showOcrText && message);
            hint.textContent = shouldShow ? message : '';
            hint.classList.toggle('visible', shouldShow);
            hint.classList.toggle('recognizing', shouldShow && Boolean(isRecognizing));
        }

        function openTransferPage(scannedValue) {
            var scannedName = cleanOcrName(scannedValue);
            if (!isPlausibleName(scannedName)) return;
            stopCamera();
            window.location.href = 'transfer.html?name=' + encodeURIComponent(scannedName);
        }

        function scheduleTransferPage(scannedValue) {
            var scannedName = cleanOcrName(scannedValue);
            if (!isPlausibleName(scannedName)) return;
            stopCamera();
            clearTimeout(customTransferTimer);
            customTransferTimer = setTimeout(function () {
                customTransferTimer = null;
                openTransferPage(scannedName);
            }, 5000);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(timer);
            timer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
        }

        function stopCamera() {
            scanning = false;
            clearTimeout(ocrTimer);
            if (stream) {
                stream.getTracks().forEach(function (track) { track.stop(); });
                stream = null;
            }
        }

        function cleanOcrName(value) {
            return (value || '')
                .replace(/[\r\n\t ]+/g, '')
                .replace(/[|｜丨]/g, '')
                .replace(/[^\u3400-\u9fffA-Za-z0-9_().（）*·\-]/g, '')
                .slice(0, 20);
        }

        function selectOcrName(value) {
            var candidates = (value || '').split(/\r?\n/).map(function (line) { return cleanOcrName(line); }).filter(function (line) { return line.length > 0; });
            candidates = candidates.filter(function (line) { return !/二维码|扫一扫|微信支付|识别/.test(line); });
            candidates.sort(function (left, right) {
                var leftChinese = (left.match(/[\u3400-\u9fff]/g) || []).length;
                var rightChinese = (right.match(/[\u3400-\u9fff]/g) || []).length;
                return rightChinese - leftChinese || right.length - left.length;
            });
            return candidates[0] || '';
        }

        function isPlausibleName(value) {
            if (!value || /二维码|扫一扫|微信支付|识别/.test(value)) return false;
            return /[\u3400-\u9fff]{2,}/.test(value) || /[A-Za-z]{3,}/.test(value);
        }

        function getVisibleSourceRect() {
            var videoWidth = video.videoWidth;
            var videoHeight = video.videoHeight;
            var boxWidth = viewfinder.clientWidth;
            var boxHeight = viewfinder.clientHeight;
            var scale = Math.max(boxWidth / videoWidth, boxHeight / videoHeight);
            var visibleWidth = boxWidth / scale;
            var visibleHeight = boxHeight / scale;
            return {
                x: (videoWidth - visibleWidth) / 2,
                y: (videoHeight - visibleHeight) / 2,
                width: visibleWidth,
                height: visibleHeight
            };
        }

        function prepareNameCrop() {
            var visible = getVisibleSourceRect();
            var crop = {
                x: visible.x + visible.width * 0.08,
                y: visible.y + visible.height * 0.56,
                width: visible.width * 0.84,
                height: visible.height * 0.18
            };
            var outputWidth = scanSettings && scanSettings.speed === 'fast' ? 960 : 1200;
            var outputHeight = Math.max(300, Math.round(outputWidth * crop.height / crop.width));
            canvas.width = outputWidth;
            canvas.height = outputHeight;
            var context = canvas.getContext('2d', { willReadFrequently: true });
            context.drawImage(video, crop.x, crop.y, crop.width, crop.height, 0, 0, outputWidth, outputHeight);
            var image = context.getImageData(0, 0, outputWidth, outputHeight);
            for (var i = 0; i < image.data.length; i += 4) {
                var gray = Math.round(image.data[i] * 0.299 + image.data[i + 1] * 0.587 + image.data[i + 2] * 0.114);
                var contrast = Math.max(0, Math.min(255, (gray - 128) * 1.45 + 128));
                image.data[i] = contrast;
                image.data[i + 1] = contrast;
                image.data[i + 2] = contrast;
            }
            context.putImageData(image, 0, 0);
            return canvas;
        }

        async function createOcrWorker() {
            if (ocrWorker || ocrLoading || !window.Tesseract) return ocrWorker;
            ocrLoading = true;
            setHint('正在加载中英文识别组件...', true);
            hint.classList.add('recognizing');
            try {
                var assetRoot = new URL('js/ocr/', document.baseURI).href;
                ocrWorker = await Tesseract.createWorker('chi_sim+eng', 1, {
                    workerPath: assetRoot + 'worker.min.js',
                    langPath: assetRoot + 'lang',
                    corePath: assetRoot + 'core'
                });
                await ocrWorker.setParameters({ tessedit_pageseg_mode: '7', preserve_interword_spaces: '0' });
                return ocrWorker;
            } catch (error) {
                setHint('中英文识别组件加载失败，请刷新页面后重试', false);
                showToast('OCR 加载失败');
                return null;
            } finally {
                ocrLoading = false;
            }
        }

        async function recognizeName() {
            if (!scanning || ocrRunning || !ocrWorker || video.readyState < 2) return;
            ocrRunning = true;
            try {
                var result = await ocrWorker.recognize(prepareNameCrop());
                var recognizedName = selectOcrName(result && result.data ? result.data.text : '');
                if (isPlausibleName(recognizedName)) {
                    ocrFailureCount = 0;
                    if (recognizedName === ocrCandidate) ocrCandidateCount += 1;
                    else { ocrCandidate = recognizedName; ocrCandidateCount = 1; }
                    setHint('正在确认网名：' + recognizedName, true);
                    if (ocrCandidateCount >= OCR_SPEEDS[scanSettings.speed].confirmations) {
                        openTransferPage(recognizedName);
                        return;
                    }
                } else {
                    ocrFailureCount += 1;
                    setHint('', false);
                    if (scanSettings.customName && ocrFailureCount >= 3) {
                        showToast('未识别到网名，使用默认转账人');
                        scheduleTransferPage(scanSettings.customName);
                        return;
                    }
                }
            } catch (error) {
                ocrFailureCount += 1;
                setHint('', false);
                if (scanSettings.customName && ocrFailureCount >= 3) {
                    showToast('识别失败，使用默认转账人');
                    scheduleTransferPage(scanSettings.customName);
                    return;
                }
            } finally {
                ocrRunning = false;
                if (scanning) ocrTimer = setTimeout(recognizeName, OCR_SPEEDS[scanSettings.speed].interval);
            }
        }

        async function startOcr() {
            var worker = await createOcrWorker();
            if (worker && scanning) {
                setHint('', false);
                ocrTimer = setTimeout(recognizeName, OCR_SPEEDS[scanSettings.speed].interval);
            }
        }

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                hint.textContent = '当前浏览器不支持摄像头，请使用手机 Chrome 或 Safari';
                showToast('浏览器不支持摄像头');
                return;
            }
            try {
                setHint('', false);
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
                video.srcObject = stream;
                viewfinder.classList.add('camera-on');
                scanning = true;
                scanSettings = readScanSettings();
                if (scanSettings.useCustom) {
                    if (scanSettings.customName) {
                        scheduleTransferPage(scanSettings.customName);
                    } else {
                        setHint('', false);
                        showToast('请先在设置中填写转账人名称');
                    }
                    return;
                }
                startOcr();
            } catch (error) {
                hint.textContent = '无法打开摄像头，请允许浏览器使用摄像头后重试';
                showToast('摄像头权限未开启');
            }
        }

        viewfinder.addEventListener('click', function () { if (!scanning) startCamera(); });
        viewfinder.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                if (!scanning) startCamera();
            }
        });
        document.getElementById('backButton').addEventListener('click', function () { clearTimeout(customTransferTimer); if (history.length > 1) history.back(); else window.location.href = 'index.html'; });
        document.getElementById('settingsButton').addEventListener('click', function () { window.location.href = 'settings.html'; });
        document.getElementById('myQrButton').addEventListener('click', function () { showToast('我的二维码功能即将上线'); });
        document.getElementById('albumButton').addEventListener('click', function () { showToast('相册功能即将上线'); });
        document.getElementById('translateButton').addEventListener('click', function () { showToast('翻译功能即将上线'); });
        window.addEventListener('load', function () {
            scanSettings = readScanSettings();
            if (!params.has('preview') && window.location.protocol !== 'file:') startCamera();
        });
        window.addEventListener('pagehide', function () {
            stopCamera();
            clearTimeout(customTransferTimer);
            if (ocrWorker) ocrWorker.terminate();
        });
    }());
</script>
</body>
</html>
