<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ededed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="转账成功">
    <title>转账成功</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon-180.png">
    <script src="js/lucide.min.js"></script>
    <style>
        :root { --bg:#ededed; --surface:#fff; --text:#191919; --muted:#8a8a8a; --line:#e8e8e8; --green:#07c160; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
        button { border:0; font:inherit; cursor:pointer; }
        .success-app { min-height:100dvh; max-width:520px; margin:0 auto; padding:env(safe-area-inset-top) 16px max(24px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; background:var(--surface); }
        .result { flex:1; padding-top:18vh; display:flex; flex-direction:column; align-items:center; text-align:center; }
        .checkmark { width:76px; height:76px; display:grid; place-items:center; background:var(--green); color:#fff; border-radius:50%; }
        .checkmark svg { width:46px; height:46px; stroke-width:2.5; }
        .title { margin:20px 0 0; font-size:22px; font-weight:600; }
        .amount { margin:28px 0 0; font-size:38px; font-weight:600; line-height:1.2; }
        .recipient { margin:12px 0 0; color:var(--muted); font-size:15px; }
        .demo-note { margin:26px 0 0; color:#aaa; font-size:12px; }
        .complete-button { width:100%; height:48px; margin-top:32px; display:flex; align-items:center; justify-content:center; background:var(--green); color:#fff; border-radius:4px; font-size:16px; font-weight:500; }
        .complete-button:active { background:#06ad56; }
        @media (min-width:521px) { body { padding:20px 0; } .success-app { min-height:calc(100dvh - 40px); height:calc(100dvh - 40px); border-radius:8px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.16); } }
    </style>
</head>
<body>
<div class="success-app">
    <main class="result">
        <div class="checkmark" aria-label="转账成功"><i data-lucide="check"></i></div>
        <h1 class="title">转账成功</h1>
        <p class="amount" id="amountText">¥0.00</p>
        <p class="recipient">已转账给 <span id="recipientName">XXX</span></p>
        <p class="demo-note">界面演示，不代表真实交易结果</p>
    </main>
    <button class="complete-button" id="completeButton">完成</button>
</div>
<script>
    (function () {
        lucide.createIcons();
        var params = new URLSearchParams(window.location.search);
        var amount = Number(params.get('amount'));
        var recipient = params.get('name') || 'XXX';
        document.getElementById('amountText').textContent = '¥' + (Number.isFinite(amount) && amount > 0 ? amount.toFixed(2) : '0.00');
        document.getElementById('recipientName').textContent = recipient.slice(0, 20);
        document.getElementById('completeButton').addEventListener('click', function () {
            window.location.href = 'index.html';
        });
    }());
</script>
</body>
</html>
