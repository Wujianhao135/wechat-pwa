<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="支付成功">
    <title>支付成功</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon-180.png">
    <style>
        :root { --green:#07c160; --text:#171717; --button:#f1f1f1; }
        * { box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; }
        body { margin:0; background:#fff; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
        button { border:0; cursor:pointer; font:inherit; }
        .success-app { width:100%; max-width:520px; height:100dvh; min-height:100dvh; margin:0 auto; padding:calc(26px + env(safe-area-inset-top)) 24px calc(34px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; background:#fff; }
        .success-heading { display:flex; align-items:center; justify-content:center; gap:14px; color:var(--green); }
        .success-heading h1 { margin:0; font-size:25px; font-weight:600; line-height:38px; }
        .success-logo { width:47px; height:42px; position:relative; display:block; background:var(--green); border-radius:50%; }
        .success-logo::before { content:""; width:17px; height:10px; position:absolute; bottom:-3px; left:7px; background:var(--green); clip-path:polygon(0 0,100% 0,0 100%); }
        .success-logo::after { content:""; width:25px; height:13px; position:absolute; top:12px; left:12px; border-bottom:5px solid #fff; border-left:5px solid #fff; transform:rotate(-45deg); border-radius:2px; }
        .success-main { min-height:0; flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; }
        .recipient-avatar { width:88px; height:88px; margin-top:86px; overflow:hidden; background:#f5f5f5; border-radius:50%; }
        .recipient-avatar img { width:100%; height:100%; display:block; object-fit:cover; }
        .recipient-name { max-width:100%; margin:22px 0 0; overflow:hidden; font-size:28px; line-height:38px; white-space:nowrap; text-overflow:ellipsis; }
        .amount { margin:58px 0 0; font-size:64px; font-weight:600; line-height:1.05; letter-spacing:0; }
        .complete-button { width:min(260px,100%); height:64px; margin:0 auto; flex:0 0 64px; color:#111; background:var(--button); border-radius:20px; font-size:25px; font-weight:600; }
        .complete-button:active { background:#e5e5e5; }
        @media (max-width:380px) { .success-app { padding-left:20px; padding-right:20px; }.success-heading { gap:9px; }.success-heading h1 { font-size:23px; }.success-logo { width:42px; height:36px; }.success-logo::after { transform:scale(.78) rotate(-45deg); transform-origin:center; }.recipient-avatar { width:78px; height:78px; margin-top:78px; }.recipient-name { margin-top:18px; font-size:25px; }.amount { margin-top:48px; font-size:57px; }.complete-button { width:min(235px,100%);height:58px; flex-basis:58px; border-radius:17px; font-size:23px; } }
        @media (min-width:521px) { body { padding:20px 0; }.success-app { height:calc(100dvh - 40px); min-height:calc(100dvh - 40px); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.12); } }
    </style>
</head>
<body>
<div class="success-app">
    <header class="success-heading" aria-label="支付成功">
        <span class="success-logo" aria-hidden="true"></span>
        <h1>支付成功</h1>
    </header>
    <main class="success-main">
        <div class="recipient-avatar"><img id="recipientAvatarImage" src="img/default-transfer-avatar.png" alt="收款人头像"></div>
        <p class="recipient-name" id="recipientName">XXX</p>
        <p class="amount" id="amountText">¥0.00</p>
    </main>
    <button class="complete-button" id="completeButton" type="button">完成</button>
</div>
<script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var amount = Number(params.get('amount'));
        var recipient = (params.get('name') || 'XXX').slice(0, 20);
        var avatarImage = document.getElementById('recipientAvatarImage');
        var defaultAvatar = localStorage.getItem('scan_default_avatar') || 'img/default-transfer-avatar.png';
        document.title = '支付成功';
        document.getElementById('amountText').textContent = '¥' + (Number.isFinite(amount) && amount > 0 ? amount.toFixed(2) : '0.00');
        document.getElementById('recipientName').textContent = recipient;
        avatarImage.src = defaultAvatar;
        avatarImage.addEventListener('error', function () { this.src = 'img/default-transfer-avatar.png'; });
        document.getElementById('completeButton').addEventListener('click', function () { window.location.href = 'index.html'; });
    }());
</script>
</body>
</html>
